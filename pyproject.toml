[project]
name = "sundial"
version = "3.1.0"
description = "A sense of time for AI agents. Local-first, zero-dependency, no LLM in the loop."
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # long human-facing message pools & test literals; wrapping them harms grep-ability

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["lib", "watcher", "core", "core/backends_impl", "cli", "hooks"]

