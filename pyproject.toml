[project]
name = "sundial"
version = "3.0.0a0"
description = "A sense of time for AI agents. Local-first, zero-dependency, no LLM in the loop."
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]  # pycodestyle, pyflakes — strict but simple
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
